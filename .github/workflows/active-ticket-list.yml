name: Active ticket list

on:
  pull_request:
    paths:
      - 'src/components/board/Ticket*'
      - 'src/components/board/ticket-list.css'
      - 'src/app/Workspace.tsx'
      - 'src/data/ticket-project-summary.ts'
      - 'tests/*ticket*.spec.ts'
      - 'tests/support/ticket-list.ts'
      - '.github/workflows/active-ticket-list.yml'

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/active-ticket-list.spec.ts tests/ticket-list.spec.ts tests/ticket-status-bars.spec.ts tests/ticket-activity.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-ticket-list-screenshots
          path: test-results/
          retention-days: 14
