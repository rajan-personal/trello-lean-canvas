name: CI

on:
  pull_request:
    branches: [main, 'design-31/**']
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize production releases; only superseded PR checks may be cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-and-deploy:
    name: Check and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Use the repository's npm version
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Firestore rules and persistence tests
        run: npm run test:firestore

      - name: Install Chromium for browser regression tests
        run: npx playwright install --with-deps chromium

      - name: Nested-ticket and PWA browser regression tests
        run: npx playwright test tests/nested-*.spec.ts tests/pwa-updates.spec.ts --workers=2

      # Rebuild in production mode after the browser tests' test-mode build.
      - name: Validate production build and Worker configuration
        run: npm run deploy:dry-run

      # PRs never receive deployment credentials or publish to production.
      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN Actions secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID Actions secret"; exit 1; }
          npm run deploy

      - name: Verify production serves the deployed build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "https://lean.addorimprove.com/?release=$GITHUB_SHA" \
              --output "$RUNNER_TEMP/production-index.html" \
              && cmp --silent dist/index.html "$RUNNER_TEMP/production-index.html"; then
              echo "Verified https://lean.addorimprove.com at $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "Production did not serve the expected build within the verification window"
          exit 1
