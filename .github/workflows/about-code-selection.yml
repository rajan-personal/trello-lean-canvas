name: About code selection

on:
  pull_request:
    paths:
      - 'src/components/**'
      - 'tests/project-code*.spec.ts'
      - '.github/workflows/about-code-selection.yml'

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:storybook -- src/components/ProjectAbout.stories.tsx
      - run: npx playwright test tests/project-code-selection.spec.ts tests/project-code-formatting.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: about-code-selection-screenshots
          path: test-results/
          retention-days: 14
